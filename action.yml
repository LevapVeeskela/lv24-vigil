name: "Vigil security scan"
description: "Run the Vigil deterministic security scan (npm package) and expose the report path. Requires Node.js on the runner."
author: "LV24"

# Composite action. It installs the npm package, runs `vigil scan`, writes the
# report and exposes its path. It does NOT upload SARIF: add the CodeQL action
# after this step with `if: always()` so the report is uploaded even when Vigil
# exits 2 because findings were found:
#
#   - id: vigil
#     uses: LevapVeeskela/lv24-vigil@v0.6.0
#     with:
#       path: .
#       fail-on: high
#       no-llm: true
#       format: sarif
#       version: 0.6.0
#   - uses: github/codeql-action/upload-sarif@v4
#     if: always()
#     with:
#       sarif_file: ${{ steps.vigil.outputs.sarif }}
#
# Node.js 18+ must be available (GitHub-hosted runners include it; call
# actions/setup-node first on a self-hosted runner). The action uses bash, which
# is available on GitHub-hosted Linux, macOS and Windows runners.

branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Repository path to scan."
    required: false
    default: "."
  fail-on:
    description: "Exit with code 2 when a finding at or above this severity exists: low, medium, high, critical."
    required: false
    default: "high"
  no-llm:
    description: "Run deterministic rules only (true/false). Keep true for offline, keyless CI."
    required: false
    default: "true"
  format:
    description: "Report format: sarif, json, md or html."
    required: false
    default: "sarif"
  version:
    description: "npm version or dist-tag of lv24-vigil to install. Defaults to this action's release version (0.6.0)."
    required: false
    default: "0.6.0"

outputs:
  sarif:
    description: "Path to the generated report (SARIF by default)."
    value: ${{ steps.scan.outputs.report }}
  report:
    description: "Path to the generated report."
    value: ${{ steps.scan.outputs.report }}
  exit-code:
    description: "Vigil exit code: 0 clean, 1 error, 2 findings at or above fail-on."
    value: ${{ steps.scan.outputs.exit-code }}
  version:
    description: "npm version or dist-tag installed by the action."
    value: ${{ steps.install.outputs.version }}

runs:
  using: "composite"
  steps:
    - id: install
      shell: bash
      env:
        VIGIL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${VIGIL_VERSION:-0.6.0}"
        npm i -g "lv24-vigil@${version}"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - id: scan
      shell: bash
      env:
        VIGIL_PATH: ${{ inputs.path }}
        VIGIL_FAIL_ON: ${{ inputs['fail-on'] }}
        VIGIL_NO_LLM: ${{ inputs['no-llm'] }}
        VIGIL_FORMAT: ${{ inputs.format }}
        VIGIL_VERSION: ${{ inputs.version }}
        VIGIL_RESOLVED_VERSION: ${{ steps.install.outputs.version }}
      run: |
        set -uo pipefail

        format="${VIGIL_FORMAT:-sarif}"
        case "$format" in
          sarif|json|md|html) ;;
          *) echo "vigil: unsupported format '$format' (use sarif, json, md or html)" >&2; exit 1 ;;
        esac

        no_llm="${VIGIL_NO_LLM:-true}"
        case "$no_llm" in
          true|TRUE|1|yes) ;;
          false|FALSE|0|no) ;;
          *) echo "vigil: unsupported no-llm value '$no_llm' (use true or false)" >&2; exit 1 ;;
        esac

        out="${GITHUB_WORKSPACE}/vigil.${format}"
        args=(scan "${VIGIL_PATH:-.}" --format "$format" --output "$out" --fail-on "${VIGIL_FAIL_ON:-high}")
        case "$no_llm" in
          true|TRUE|1|yes) args+=(--no-llm) ;;
        esac

        if command -v vigil >/dev/null 2>&1; then
          bin=(vigil)
        else
          echo "vigil: global command not found; using npx" >&2
          bin=(npx --yes "lv24-vigil@${VIGIL_RESOLVED_VERSION:-${VIGIL_VERSION:-latest}}")
        fi

        set +e
        "${bin[@]}" "${args[@]}"
        code=$?
        set -e

        printf 'report=%s\n' "$out" >> "$GITHUB_OUTPUT"
        printf 'exit-code=%s\n' "$code" >> "$GITHUB_OUTPUT"
        exit "$code"
