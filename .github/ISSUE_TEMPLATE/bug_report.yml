name: Bug report
description: Something in Vigil behaves incorrectly or crashes.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the fields below so the bug can be
        reproduced without a round trip.

        **Do not report security vulnerabilities here.** Use the
        [security policy](https://github.com/LevapVeeskela/lv24-vigil/security/policy)
        instead — public issues are visible to everyone.

  - type: input
    id: version
    attributes:
      label: Vigil version
      description: Output of `vigil version`.
      placeholder: "0.1.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS, architecture and install method.
      placeholder: "Windows 11 x64, release binary from GitHub"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, with secrets and keys removed.
      render: shell
      placeholder: "vigil scan . --no-llm --format sarif"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: |
        What happened instead. Include the exit code (0 success, 1 error,
        2 findings at or above `--fail-on`).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: |
        Relevant output or a minimal report sample. Replace real credentials,
        tokens and internal paths before pasting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The smallest file or repository layout that triggers the problem. For a
        rule false positive, paste the code fragment that should stay quiet.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on the latest release and the problem still reproduces.
          required: false
        - label: I searched existing issues before opening this one.
          required: true
