name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless cosign signing and build provenance both use the GitHub OIDC
      # token; the attestation itself is written to the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish -f deploy/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release SBOM
        env:
          TAG: ${{ github.ref_name }}
        # `go run` builds the tagged source with the local toolchain and
        # `vigil sbom` is offline: it inventories go.mod, lockfiles and
        # declared manifests, so it never needs network access.
        run: |
          set -euo pipefail
          mkdir -p release-assets
          sbom="release-assets/vigil-sbom-${TAG#v}.cdx.json"
          go run ./cmd/vigil sbom . --format cyclonedx --output "$sbom"
          test -s "$sbom"
          # The SBOM stamps version.Version from the source fallback. A tag
          # without a matching bump would publish a document that names the
          # previous release, so fail before creating the release.
          grep -A2 '"name": "Vigil"' "$sbom" | grep -q "\"version\": \"${TAG#v}\"" || {
            echo "SBOM tool version does not match ${TAG#v}" >&2
            exit 1
          }

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f | while read -r file; do
            base="$(basename "$file")"
            case "$base" in
              vigil_*|checksums.txt|*.deb|*.rpm|*.apk|*.sigstore.json) cp "$file" "release-assets/$base" ;;
            esac
          done
          # The SBOM is named vigil-sbom-<version>.cdx.json, so exclude it from
          # the binary count; exactly six vigil_* binaries are expected.
          count="$(find release-assets -maxdepth 1 -type f -name 'vigil_*' ! -name 'vigil-sbom-*' | wc -l | tr -d ' ')"
          if [ "$count" -ne 6 ]; then
            echo "expected 6 release binaries, found $count" >&2
            exit 1
          fi
          if [ ! -f release-assets/checksums.txt ]; then
            echo "checksums.txt is missing from the release assets" >&2
            exit 1
          fi
          package_count="$(find release-assets -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \) | wc -l | tr -d ' ')"
          if [ "$package_count" -ne 6 ]; then
            echo "expected 6 Linux packages (deb/rpm/apk x amd64/arm64), found $package_count" >&2
            exit 1
          fi
          ls -l release-assets

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.4.1

      - name: Sign checksums with cosign (keyless)
        # The bundle covers checksums.txt, which lists the six binaries and the
        # six Linux packages; signing each file separately is unnecessary.
        # Keyless: the OIDC token identifies this workflow run and cosign writes
        # to the transparency log, so there is no key to store.
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle release-assets/checksums.txt.sigstore.json \
            release-assets/checksums.txt
          test -s release-assets/checksums.txt.sigstore.json
          ls -l release-assets/checksums.txt.sigstore.json

      - name: Attest release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Export provenance bundle as a release asset
        # Scorecard's Signed-Releases check looks for a provenance/signature
        # file attached to the release itself, not only for an entry in the
        # repository attestation store. The bundle covers every asset attested
        # in the step above; it is written afterwards so it is not a subject of
        # itself. The publish step below uploads it through the existing
        # `gh release create release-assets/*` glob.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE"
          test -s "$BUNDLE"
          cp "$BUNDLE" release-assets/provenance.intoto.jsonl
          test -s release-assets/provenance.intoto.jsonl
          ls -l release-assets/provenance.intoto.jsonl

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading missing assets"
            existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for file in release-assets/*; do
              base="$(basename "$file")"
              if printf '%s\n' "$existing" | grep -Fxq "$base"; then
                echo "skip existing asset $base"
                continue
              fi
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            done
          else
            prerelease_args=()
            case "$TAG" in
              *-*) prerelease_args=(--prerelease) ;;
            esac
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vigil ${TAG#v}" \
              --generate-notes \
              ${prerelease_args[@]+"${prerelease_args[@]}"}
          fi

  # npm is published by npm-publish.yml via a workflow_run trigger after this
  # workflow completes. It must stay a separate workflow because npm Trusted
  # Publishing is bound to the workflow file that owns the publish job.
