name: npm-publish

# Publishes the npm packages for an existing GitHub release.
#
# Two triggers:
#   - workflow_run: runs after the `release` workflow completes for a tag. The
#     job must be this workflow (not a reusable workflow called from
#     release.yml) because npm Trusted Publishing is bound to the workflow file
#     that owns the job: `npm-publish.yml`.
#   - workflow_dispatch: manual re-publish of a tag (for example after a failed
#     publish).
#
# Every binary checksum is verified by npm/build.mjs before anything is
# published. Versions already on npm are skipped, so re-running is safe.

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and provenance.
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Validate tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag must look like v1.2.3 (got '$TAG')" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # No registry-url: it writes an .npmrc with a placeholder
          # NODE_AUTH_TOKEN that npm would send instead of using OIDC.
          node-version: "24"

      - name: Build npm packages
        run: node npm/build.mjs --version "${TAG#v}" --dist release-assets --out npm-out

      # Trusted Publishing uses the job's OIDC token (id-token: write). The
      # NODE_AUTH_TOKEN fallback is used only when NPM_TOKEN is configured.
      # A trust regression is reported as a warning instead of turning the
      # already-published GitHub release red.
      - name: Publish npm packages
        id: publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash npm/publish.sh "${TAG#v}" npm-out

      - name: Report npm publish status
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=npm::npm publish failed. The GitHub release is published. Check the trusted publisher for lv24-vigil and the six @lv24/vigil-* packages (workflow npm-publish.yml), then run this workflow manually with the tag."
