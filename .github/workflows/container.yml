name: container

# Publishes the multi-arch Vigil image to GHCR for an existing release tag.
#
# Two triggers:
#   - push of a `v*` tag (the same tag that starts `release.yml`);
#   - workflow_dispatch with an explicit tag, for a manual re-publish after a
#     failed build. Dispatch on a branch without a tag is rejected.
#
# The image is built for linux/amd64 and linux/arm64 from the repository
# Dockerfile (distroless/static, nonroot, entrypoint `vigil`), with SBOM and
# provenance attestations. The only credential is the job's GITHUB_TOKEN.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Resolve version metadata
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag must look like v1.2.3 (got '$TAG')" >&2
            exit 1
          fi
          version="${TAG#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(git log -1 --format=%cI)"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/levapveeskela/lv24-vigil
          # `latest` is set explicitly below, so the automatic flavor rule is off.
          flavor: |
            latest=false
          tags: |
            type=semver,value=${{ steps.version.outputs.version }},pattern={{version}}
            type=semver,value=${{ steps.version.outputs.version }},pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # No build-record artifact: the image, its SBOM and its provenance are
        # the record, and artifact storage is not needed for a release.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            DATE=${{ steps.version.outputs.date }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Summarize image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ghcr.io/levapveeskela/lv24-vigil"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
