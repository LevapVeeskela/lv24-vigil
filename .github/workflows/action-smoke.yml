name: action-smoke

# Manual end-to-end check of the published Marketplace action.
# It scans a clean fixture, asserts that the action pinned the npm CLI to its
# own tag (0.5.4), and uploads the SARIF report.

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vigil
        uses: LevapVeeskela/lv24-vigil@v0.6.0
        with:
          path: examples/action-smoke
          fail-on: high
          no-llm: true
          format: sarif

      - name: Assert the action pinned the CLI to its tag
        run: test "${{ steps.vigil.outputs.version }}" = "0.6.0"

      - if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.vigil.outputs.sarif }}
