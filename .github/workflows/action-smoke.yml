name: action-smoke

# Manual end-to-end check of the published Marketplace action.
# It scans a clean fixture, asserts that the action pinned the npm CLI to its
# own tag (0.5.3), and uploads the SARIF report.

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: vigil
        uses: LevapVeeskela/lv24-vigil@v0.5.3
        with:
          path: examples/action-smoke
          fail-on: high
          no-llm: true
          format: sarif

      - name: Assert the action pinned the CLI to its tag
        run: test "${{ steps.vigil.outputs.version }}" = "0.5.3"

      - if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.vigil.outputs.sarif }}
