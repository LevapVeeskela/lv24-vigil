name: action-smoke

# Manual end-to-end check of the published Marketplace action.
# It scans a clean fixture, asserts that the action pinned the npm CLI to its
# own tag (0.10.3), and uploads the SARIF report.

on:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository. The
# security-events write scope is granted to the job that uploads SARIF, so a
# widening of one job cannot leak into others.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by github/codeql-action/upload-sarif below.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vigil
        uses: LevapVeeskela/lv24-vigil@ea679ce27bce68e3a2a35c13c9ea58aad4cd1f8b # v0.10.3
        with:
          path: examples/action-smoke
          fail-on: high
          no-llm: true
          format: sarif

      - name: Assert the action pinned the CLI to its tag
        run: test "${{ steps.vigil.outputs.version }}" = "0.10.3"

      - if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.vigil.outputs.sarif }}
