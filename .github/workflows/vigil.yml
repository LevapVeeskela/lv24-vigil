name: vigil

# Dogfood: Vigil scans its own tree on every pull request and on main.
# Build, vet and test coverage live in ci.yml; this workflow only owns the
# security gate, so a failure here means "a finding at or above high".
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: vigil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: self-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -o vigil ./cmd/vigil

      - name: scan
        # --no-llm keeps the run free, offline and deterministic.
        # --fail-on high exits 2 on a high or critical finding; the report is
        # written before the exit code, so the upload step below still runs.
        # The exclude list drops rule definitions, helper scripts and prose
        # examples, not product code.
        run: >-
          ./vigil scan .
          --no-llm
          --format sarif
          --output vigil.sarif
          --fail-on high
          --exclude 'internal/rules/**'
          --exclude 'scripts/**'
          --exclude 'docs/**'
          --exclude 'examples/**'

      - name: upload SARIF
        # Fork pull requests get a read-only token, so a rejected upload must
        # not hide the scan verdict.
        if: always() && hashFiles('vigil.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: vigil.sarif
          category: vigil
