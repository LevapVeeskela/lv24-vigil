name: vigil

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vigil review
        run: |
          npx -y lv24-vigil review \
            --base origin/${{ github.event.pull_request.base.ref }} \
            --format sarif \
            --fail-on high > vigil.sarif
        env:
          # Fork PRs do not receive repository secrets. Without this key the
          # deterministic rules still run; only LLM analysis is skipped.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: vigil.sarif
