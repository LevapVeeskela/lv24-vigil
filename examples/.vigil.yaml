# Project configuration for Vigil.
#
# This file is committed to git, so it must not contain an API key.
# Put the key in ~/.config/vigil/config.yaml or the environment:
#   export OPENAI_API_KEY=...
#
# Uncomment and set a provider/model if you do not want inference:
# provider: openai
# model: gpt-4.1-mini

scan:
  # quick | standard | deep
  mode: standard

  # low | medium | high | critical
  min_severity: low

  max_findings: 200

  # Project-specific noise. Built-in excludes already cover node_modules,
  # vendor, dist, build, target, virtualenvs and .vigil.
  exclude:
    - "fixtures/**"
    - "testdata/**"

  # Set false to make this project deterministic-only by default.
  use_llm: true

  baseline: .vigil-baseline.json

output:
  # md | json | sarif | html
  format: md
  color: auto
  show_fix: true

# OpenCode Go is a hosted, OpenAI-compatible provider. Put the key in the user
# config or OPENCODE_API_KEY, not here:
# provider: opencode-go
# model: deepseek-v4.1-flash
# base_url: https://opencode.ai/inference/go/openai/v1

# The `command` provider runs a local CLI with its own authentication (for
# example `opencode run`). It cannot be configured in this committed file:
# `command`, `command_env`, `command_prompt_mode` and `command_output` are
# rejected here on purpose. Put them in ~/.config/vigil/config.yaml:
#
#   provider: command
#   model: opencode-go/deepseek-v4.1-flash
#   command:
#     - opencode
#     - run
#     - --format
#     - json
#     - --model
#     - opencode-go/deepseek-v4.1-flash
#     - --agent
#     - plan
#     - "{prompt}"
#   command_output: opencode-json
#
# See docs/providers.md for stdin mode, timeouts and the security notes.
