[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lv24-vigil"
version = "0.10.3"
description = "Python launcher for the lv24-vigil (Vigil) CLI"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "LevapVeeskela" },
]
keywords = [
    "security",
    "audit",
    "sast",
    "static-analysis",
    "vulnerability-scanner",
    "secrets",
    "mcp",
    "llm",
    "cli",
    "launcher",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/LevapVeeskela/lv24-vigil"
Repository = "https://github.com/LevapVeeskela/lv24-vigil"
Issues = "https://github.com/LevapVeeskela/lv24-vigil/issues"
Documentation = "https://github.com/LevapVeeskela/lv24-vigil/blob/main/docs/pypi.md"
Changelog = "https://github.com/LevapVeeskela/lv24-vigil/blob/main/CHANGELOG.md"

[project.scripts]
vigil = "lv24_vigil.cli:main"
lv24-vigil = "lv24_vigil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
